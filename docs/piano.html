function frame(ms){const dt=Math.min(.05,(ms-lastFrame)/1000);lastFrame=ms;const target=(ms/1000-epoch);input.update(target);let steps=0;while(sim+step<=target&&steps++<240){sim+=step;while(queueIndex<queue.length&&queue[queueIndex].time<=sim){const e=queue[queueIndex++];dispatch(e.data,e.time);if(e.paintStamp!==null&&e.paintStamp!==undefined)pendingPaint=pendingPaint===null?e.paintStamp:Math.min(pendingPaint,e.paintStamp);}features=music.update(sim);breathPhase+=step/(2+(features.phraseSeconds-2)*settings.phrase);}
 if(steps>=240){sim=target;status('Background catch-up; latency unavailable / 后台恢复');pendingPaint=null;}
 const mapped=pianoMapping(features,settings,seed,section());mapped.evolution.clock=sim;mapped.evolution.deterministic=zero();mapped.evolution.breathRate=sim?breathPhase/sim:.125;
 if(field?.needsRebuild){field.canvas.remove();field=particleField($('stage'));}if(field)stats=field.draw(sim,dt,scene,mapped.audio,blender.visible,mapped.evolution,$('style').value)??{};
 if(pendingPaint!==null){latency=document.hidden?null:Math.max(0,performance.now()-pendingPaint);pendingPaint=null;}
 if(projector&&!projector.closed)projector.postMessage({type:'piano-frame',time:sim,dt,scene,audio:mapped.audio,evolution:mapped.evolution,style:$('style').value,loop:!zero()&&document.querySelector('video.blender.visible')?.currentSrc?{src:document.querySelector('video.blender.visible').currentSrc,time:document.querySelector('video.blender.visible').currentTime}:null},location.origin==='null'?'*':location.origin);
 if(ms-lastUI>150){lastUI=ms;$('features').textContent=JSON.stringify({...features,chroma:features.chroma.map(v=>+v.toFixed(2)),key:noteNames[features.key]+' '+features.mode,chord:noteNames[features.root]+' '+features.quality},null,2);$('timing').textContent=JSON.stringify({midi_to_render_ms:latency===null?null:+latency.toFixed(2),frame_ms:stats.frame_average_ms,particles:stats.particles,mode:zero()?'Zero-AI':'Prepared sections',time:+sim.toFixed(2)},null,2);}
 if(playing&&sim>player.duration+.5){playing=false;player=null;$('play').textContent='播放 / Play';music.reset();status('Demo complete / 示范结束');}requestAnimationFrame(frame);}
window.piano={enqueue,midi(data){const now=performance.now();enqueue(data,Math.max(0,now/1000-epoch),now)},get features(){return features},get stats(){return stats},get latency(){return latency},get time(){return sim},get settings(){return settings},reset,play};
addEventListener('pagehide',()=>{midiStop?.();input.stop();audition.stop();controller?.abort()});listPresets();setSections();requestAnimationFrame(frame);

return {};})();
